<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" width="900" height="430" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2166AC"/>
    </marker>
    <marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3D8B8D"/>
    </marker>
  </defs>
  <rect width="900" height="430" fill="#ffffff"/>

  <!-- ===== left panel: constrained ===== -->
  <text x="195" y="34" font-size="14" font-weight="600" fill="#1A1A1A" text-anchor="middle">constrained space</text>
  <text x="195" y="52" font-size="12.5" fill="#4B5563" text-anchor="middle" font-style="italic">u ∈ (0, 1)   a fraction</text>

  <line x1="78" y1="66" x2="78" y2="318" stroke="#374151" stroke-width="1.4"/>
  <line x1="78" y1="318" x2="318" y2="318" stroke="#374151" stroke-width="1.4"/>

  <!-- bounds -->
  <line x1="78" y1="70" x2="318" y2="70" stroke="#C4622D" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="322" y="66" font-size="11.5" font-weight="600" fill="#C4622D">u = 1  upper bound</text>
  <text x="322" y="322" font-size="11.5" fill="#6B7280">u = 0</text>

  <!-- members piled against the upper bound -->
  <g fill="#8C7FC4" fill-opacity="0.8">
    <circle cx="104" cy="72" r="5"/><circle cx="141" cy="77" r="5"/><circle cx="178" cy="80" r="5"/>
    <circle cx="215" cy="82" r="5"/><circle cx="252" cy="84" r="5"/><circle cx="289" cy="87" r="5"/>
    <circle cx="118" cy="87" r="5"/><circle cx="160" cy="89" r="5"/><circle cx="200" cy="92" r="5"/>
    <circle cx="238" cy="94" r="5"/><circle cx="272" cy="96" r="5"/><circle cx="300" cy="99" r="5"/>
    <circle cx="96" cy="101" r="5"/><circle cx="132" cy="104" r="5"/><circle cx="172" cy="106" r="5"/>
    <circle cx="210" cy="111" r="5"/><circle cx="248" cy="118" r="5"/><circle cx="286" cy="125" r="5"/>
    <circle cx="124" cy="135" r="5"/><circle cx="182" cy="142" r="5"/>
    <circle cx="228" cy="161" r="5"/><circle cx="150" cy="188" r="5"/>
  </g>
  <text x="195" y="230" font-size="11.5" fill="#6B7280" text-anchor="middle">members pile against</text>
  <text x="195" y="246" font-size="11.5" fill="#6B7280" text-anchor="middle">the bound, none cross it</text>

  <!-- ===== middle: the mapping ===== -->
  <path d="M 340 120 C 400 92, 470 92, 528 120" fill="none" stroke="#2166AC" stroke-width="1.7" marker-end="url(#a1)"/>
  <text x="434" y="88" font-size="12.5" font-weight="600" fill="#2166AC" text-anchor="middle">logit</text>

  <path d="M 528 210 C 470 238, 400 238, 340 210" fill="none" stroke="#3D8B8D" stroke-width="1.7" marker-end="url(#a2)"/>
  <text x="434" y="258" font-size="12.5" font-weight="600" fill="#3D8B8D" text-anchor="middle">sigmoid</text>

  <text x="434" y="168" font-size="11.5" fill="#6B7280" text-anchor="middle">log / exp for a</text>
  <text x="434" y="184" font-size="11.5" fill="#6B7280" text-anchor="middle">one-sided bound</text>

  <!-- ===== right panel: unconstrained ===== -->
  <text x="710" y="34" font-size="14" font-weight="600" fill="#1A1A1A" text-anchor="middle">unconstrained space</text>
  <text x="710" y="52" font-size="12.5" fill="#4B5563" text-anchor="middle" font-style="italic">ũ on the whole real line, no bounds</text>

  <line x1="570" y1="66" x2="570" y2="318" stroke="#374151" stroke-width="1.4"/>
  <line x1="570" y1="318" x2="858" y2="318" stroke="#374151" stroke-width="1.4"/>

  <g fill="#3D8B8D" fill-opacity="0.8">
    <circle cx="598" cy="118" r="5"/><circle cx="632" cy="104" r="5"/><circle cx="666" cy="132" r="5"/>
    <circle cx="700" cy="112" r="5"/><circle cx="734" cy="140" r="5"/><circle cx="768" cy="120" r="5"/>
    <circle cx="802" cy="150" r="5"/><circle cx="836" cy="128" r="5"/>
    <circle cx="612" cy="158" r="5"/><circle cx="648" cy="172" r="5"/><circle cx="682" cy="162" r="5"/>
    <circle cx="716" cy="186" r="5"/><circle cx="750" cy="168" r="5"/><circle cx="784" cy="196" r="5"/>
    <circle cx="818" cy="176" r="5"/>
    <circle cx="604" cy="210" r="5"/><circle cx="660" cy="222" r="5"/><circle cx="706" cy="206" r="5"/>
    <circle cx="762" cy="232" r="5"/><circle cx="812" cy="216" r="5"/>
    <circle cx="676" cy="252" r="5"/><circle cx="742" cy="264" r="5"/>
  </g>
  <text x="710" y="292" font-size="11.5" font-weight="600" fill="#3D8B8D" text-anchor="middle">the Kalman update is applied here</text>

  <!-- ===== note ===== -->
  <rect x="40" y="342" width="820" height="72" rx="6" fill="#F8FAFC" stroke="#CBD5E1"/>
  <text x="58" y="366" font-size="12.5" fill="#374151">
    The Kalman update is linear and unbounded, so each parameter is mapped to an unconstrained scale, updated there, and mapped back.
  </text>
  <text x="58" y="385" font-size="12.5" fill="#374151">
    A member can therefore approach a bound arbitrarily closely but never cross it.
  </text>
  <text x="58" y="405" font-size="12.5" fill="#1A1A1A" font-weight="600">
    A parameter whose posterior mass piles against its bound is unconstrained by the data at that edge, not estimated to lie there.
  </text>
</svg>
