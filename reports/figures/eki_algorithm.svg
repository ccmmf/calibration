<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 646" width="920" height="646" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/>
    </marker>
    <marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2166AC"/>
    </marker>
  </defs>
  <rect width="920" height="646" fill="#ffffff"/>

  <!-- inputs -->
  <rect x="40" y="16" width="840" height="40" rx="6" fill="#F8FAFC" stroke="#CBD5E1"/>
  <text x="58" y="41" font-size="13" font-weight="600" fill="#1A1A1A">Inputs</text>
  <text x="112" y="41" font-size="12.5" fill="#374151">observations y(obs)  ·  error covariance  Σ  ·  forward model  G( )  ·  tempering steps  K  ·  ensemble size  J</text>

  <!-- step 0 -->
  <circle cx="66" cy="100" r="17" fill="#2166AC"/>
  <text x="66" y="105" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">0</text>
  <text x="98" y="96" font-size="15" font-weight="600" fill="#2166AC">Initialization</text>
  <text x="98" y="116" font-size="12.5" fill="#4B5563">Draw an ensemble of parameter sets from the prior</text>
  <rect x="470" y="78" width="410" height="44" rx="5" fill="#F1F5F9" stroke="#CBD5E1"/>
  <text x="490" y="106" font-size="14" font-style="italic" fill="#1A1A1A">u(j) ~ p(u),    j = 1 ... J</text>

  <!-- step 1 -->
  <circle cx="66" cy="178" r="17" fill="#2166AC"/>
  <text x="66" y="183" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">1</text>
  <text x="98" y="174" font-size="15" font-weight="600" fill="#2166AC">Forward model evaluation</text>
  <text x="98" y="194" font-size="12.5" fill="#4B5563">Run the model once per ensemble member</text>
  <rect x="470" y="156" width="410" height="44" rx="5" fill="#F1F5F9" stroke="#CBD5E1"/>
  <text x="490" y="184" font-size="14" font-style="italic" fill="#1A1A1A">g(j) = G( u(j) )</text>

  <!-- step 2 -->
  <circle cx="66" cy="262" r="17" fill="#C4622D"/>
  <text x="66" y="267" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">2</text>
  <text x="98" y="258" font-size="15" font-weight="600" fill="#C4622D">Tempered observation</text>
  <text x="98" y="278" font-size="12.5" fill="#4B5563">Perturb the data, with the error variance inflated</text>
  <rect x="470" y="234" width="410" height="58" rx="5" fill="#FDF3EC" stroke="#E8C4A8"/>
  <text x="490" y="259" font-size="14" font-style="italic" fill="#1A1A1A">y(j) = g(j) + ε(j),    ε(j) ~ N( 0, K Σ )</text>
  <text x="490" y="280" font-size="11.5" fill="#8A5A34">a larger K admits the data more gradually</text>

  <!-- step 3 -->
  <circle cx="66" cy="350" r="17" fill="#3D8B8D"/>
  <text x="66" y="346" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">3</text>
  <text x="98" y="346" font-size="15" font-weight="600" fill="#3D8B8D">Ensemble covariances</text>
  <text x="98" y="366" font-size="12.5" fill="#4B5563">Estimated from the ensemble, so no model gradients</text>
  <rect x="470" y="328" width="410" height="44" rx="5" fill="#EEF5F5" stroke="#B8D4D4"/>
  <text x="490" y="351" font-size="14" font-style="italic" fill="#1A1A1A">C(u,y)   and   C(y,y)</text>
  <text x="680" y="351" font-size="11.5" fill="#4B5563">sample covariances</text>

  <!-- step 4 -->
  <circle cx="66" cy="442" r="17" fill="#2166AC"/>
  <text x="66" y="447" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">4</text>
  <text x="98" y="430" font-size="15" font-weight="600" fill="#2166AC">Kalman update, with constraint mapping</text>
  <text x="98" y="450" font-size="12.5" fill="#4B5563">Move every member toward the data. The update runs</text>
  <text x="98" y="468" font-size="12.5" fill="#4B5563">on the unconstrained scale, then maps back</text>
  <rect x="470" y="400" width="410" height="84" rx="5" fill="#F1F5F9" stroke="#CBD5E1"/>
  <text x="490" y="422" font-size="13" font-style="italic" fill="#1A1A1A">u* = M( u )</text>
  <text x="600" y="422" font-size="11" fill="#6B7280">map to the unconstrained scale</text>
  <text x="490" y="446" font-size="13" font-style="italic" fill="#1A1A1A">u*(new) = u* + W ( y(obs) - y )</text>
  <text x="490" y="470" font-size="13" font-style="italic" fill="#1A1A1A">W = C(u,y) · C(y,y)^-1</text>
  <text x="680" y="470" font-size="11" fill="#6B7280">then map back with M^-1</text>

  <!-- step 5 -->
  <circle cx="66" cy="528" r="17" fill="#2166AC"/>
  <text x="66" y="533" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">5</text>
  <text x="98" y="524" font-size="15" font-weight="600" fill="#2166AC">Updated ensemble</text>
  <text x="98" y="544" font-size="12.5" fill="#4B5563">In the original parameter space, ready for the next step</text>
  <rect x="470" y="506" width="410" height="44" rx="5" fill="#F1F5F9" stroke="#CBD5E1"/>
  <text x="490" y="534" font-size="14" font-style="italic" fill="#1A1A1A">U(k) = { u(j) }</text>

  <!-- loop arrow: step 5 back to step 1 -->
  <path d="M 44 528 L 22 528 L 22 178 L 44 178" fill="none" stroke="#2166AC" stroke-width="1.6" marker-end="url(#arb)"/>
  <text x="98" y="566" font-size="12.5" font-weight="600" fill="#2166AC">repeat steps 1 to 5 for k = 1 ... K</text>

  <!-- vertical connectors -->
  <path d="M 66 117 L 66 158" fill="none" stroke="#9CA3AF" stroke-width="1.3" marker-end="url(#ar)"/>
  <path d="M 66 195 L 66 242" fill="none" stroke="#9CA3AF" stroke-width="1.3" marker-end="url(#ar)"/>
  <path d="M 66 279 L 66 330" fill="none" stroke="#9CA3AF" stroke-width="1.3" marker-end="url(#ar)"/>
  <path d="M 66 367 L 66 422" fill="none" stroke="#9CA3AF" stroke-width="1.3" marker-end="url(#ar)"/>
  <path d="M 66 459 L 66 508" fill="none" stroke="#9CA3AF" stroke-width="1.3" marker-end="url(#ar)"/>

  <!-- output -->
  <rect x="40" y="580" width="840" height="46" rx="6" fill="#F0F7F0" stroke="#B9D4B9"/>
  <text x="58" y="608" font-size="13" font-weight="600" fill="#1A1A1A">Output</text>
  <text x="118" y="608" font-size="12.5" fill="#374151">after K steps the ensemble approximates the posterior  p( u | y(obs) ):  a distribution of parameter values, not a point estimate</text>

  <!-- notation note -->
  <text x="40" y="641" font-size="10.5" fill="#9CA3AF">u(j) is ensemble member j;  u* is u on the unconstrained scale;  k indexes the tempering step.</text>
</svg>
